name: worker-kontrol
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/kontrol.yml"]
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://yinebekleriz.ufuk87900.workers.dev
          for p in / /ayarlar /m/test12345 /admin/durum /admin/musteriler; do
            echo "=== GET $p"
            curl -s -i --max-time 20 -H "X-Admin-Key: yanlis" "$U$p" | head -20
            echo
          done
          echo "=== OPTIONS /admin/durum"
          curl -s -i --max-time 20 -X OPTIONS -H "Origin: https://ufukcicek81.github.io" "$U/admin/durum" | head -15
          echo "=== Pages admin.html icinde WORKER_URL"
          curl -s --max-time 20 https://ufukcicek81.github.io/yinebekleriz/admin.html | grep -n "WORKER_URL =\|admin/durum" | head
