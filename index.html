<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14110c">
<title>Yine Bekleriz · Asil Kuyumculuk</title>
<style>
  :root {
    --zemin: #14110c; --kart: #1f1a12; --cizgi: #3a3020;
    --altin: #d4a843; --altin-acik: #f0d48a; --yazi: #f3ede1; --soluk: #a99c84;
    --kirmizi: #d9655b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--zemin); color: var(--yazi);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh;
  }
  .sar { max-width: 440px; margin: 0 auto; padding: 22px 16px 40px; }
  .dukkan { text-align: center; color: var(--altin); letter-spacing: .2em; font-size: 12px; text-transform: uppercase; }
  h1 { text-align: center; font-size: 26px; margin: 6px 0 4px; font-weight: 700; }
  .alt-baslik { text-align: center; color: var(--soluk); font-size: 14px; margin-bottom: 20px; }
  .kart {
    background: linear-gradient(145deg, #2a2216, var(--kart));
    border: 1px solid var(--cizgi); border-radius: 18px; padding: 20px; margin-bottom: 14px;
  }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--altin); font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--soluk); margin-bottom: 4px; }
  input[type=text], input[type=tel] {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--cizgi);
    background: #0f0c08; color: var(--yazi); font: inherit; font-size: 16px; margin-bottom: 12px;
  }
  .onay { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--soluk); margin: 4px 0 16px; }
  .onay input { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--altin); flex: none; }
  button {
    width: 100%; padding: 15px; border-radius: 14px; border: 0; cursor: pointer;
    background: var(--altin); color: #1b150c; font: inherit; font-weight: 700; font-size: 16px;
  }
  button:disabled { opacity: .6; }
  .link { background: none; color: var(--soluk); font-weight: 400; font-size: 13px; padding: 8px; text-decoration: underline; }
  .hata { color: var(--kirmizi); font-size: 14px; margin-bottom: 10px; min-height: 1px; }

  .damgalar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 6px 0 14px; }
  .damga {
    aspect-ratio: 1; border-radius: 50%; border: 2px dashed var(--cizgi);
    display: grid; place-items: center; color: var(--soluk); font-size: 15px; font-weight: 600;
  }
  .damga.dolu {
    border: 2px solid var(--altin); color: #1b150c;
    background: radial-gradient(circle at 35% 30%, var(--altin-acik), var(--altin) 60%, #a37d22);
  }
  .damga.yeni { animation: bas .6s ease-out; }
  @keyframes bas { 0% { transform: scale(1.8); opacity: 0; } 60% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1); } }
  .durum { text-align: center; font-size: 15px; color: var(--soluk); }
  .durum b { color: var(--altin-acik); }

  .odul-listesi { list-style: none; margin: 0; padding: 0; }
  .odul-listesi li {
    display: flex; justify-content: space-between; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid var(--cizgi); font-size: 15px;
  }
  .odul-listesi li:last-child { border-bottom: 0; }
  .odul-listesi li b { color: var(--altin-acik); white-space: nowrap; }

  .hazir {
    background: linear-gradient(135deg, var(--altin-acik), var(--altin) 55%, #a37d22); color: #1b150c;
    border-radius: 18px; padding: 20px; text-align: center; margin-bottom: 14px;
  }
  .hazir .buyuk { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .bildirim {
    background: #20321f; border: 1px solid #6fbf73; color: #cfeccf; border-radius: 14px;
    padding: 14px; text-align: center; margin-bottom: 14px; font-weight: 600;
  }
  .kucuk { text-align: center; color: var(--soluk); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<div class="sar">
  <div class="dukkan" id="dukkan">Asil Kuyumculuk</div>
  <h1>Yine Bekleriz</h1>
  <div class="alt-baslik" id="altBaslik">Her gelişinde damga topla, indirim kazan</div>
  <div id="icerik"><div class="durum">Yükleniyor…</div></div>
</div>

<script>
  const WORKER_URL = "https://yinebekleriz.ufuk87900.workers.dev";
  const ANAHTAR = "ybKart";

  const $ = (id) => document.getElementById(id);
  const kac = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const sakla = (v) => { try { v ? localStorage.setItem(ANAHTAR, v) : localStorage.removeItem(ANAHTAR); } catch {} };
  const oku = () => { try { return localStorage.getItem(ANAHTAR); } catch { return null; } };
  const odulYaz = (o) => o.tip === "%" ? `%${o.deger} indirim` : `${Number(o.deger).toLocaleString("tr-TR")} ${o.tip === "$" ? "$" : "TL"} indirim`;

  // Tezgâhtaki QR "?tezgah=1" ile açılır: o zaman damga isteği otomatik gider
  const tezgahtan = new URLSearchParams(location.search).has("tezgah");
  if (tezgahtan) history.replaceState(null, "", location.pathname);

  let kartim = null;
  let bildirim = "";

  async function api(yol, govde) {
    const r = await fetch(WORKER_URL + yol, govde
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(govde) }
      : { cache: "no-store" });
    const veri = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(veri.hata || "Bağlantı hatası"); e.durum = r.status; throw e; }
    return veri;
  }

  // ---------- Kayıt ----------
  async function kayitEkrani() {
    let ayar = { hedef: 5, oduller: [] };
    try { ayar = await api("/ayarlar"); } catch {}
    $("altBaslik").textContent = `${ayar.hedef} gelişte indirim kazan`;
    $("icerik").innerHTML = `
      <div class="kart">
        <h2>Karta katıl</h2>
        <label for="ad">Adınız Soyadınız</label>
        <input id="ad" type="text" autocomplete="name">
        <label for="tel">Cep telefonunuz</label>
        <input id="tel" type="tel" inputmode="tel" placeholder="5xx xxx xx xx" autocomplete="tel">
        <div class="onay"><input id="onay" type="checkbox"><span>Adımın ve telefonumun sadakat programı için Asil Kuyumculuk tarafından kaydedilmesini kabul ediyorum.</span></div>
        <div class="hata" id="hata"></div>
        <button id="katil">Katıl</button>
        <div class="kucuk">Daha önce katıldıysanız sadece telefonunuzu yazmanız yeterli.</div>
      </div>
      ${ayar.oduller.length ? `<div class="kart"><h2>${ayar.hedef} gelişte kazanacağınız indirimler</h2><ul class="odul-listesi">${ayar.oduller.map((o) => `<li><span>${kac(o.urun)}</span><b>${odulYaz(o)}</b></li>`).join("")}</ul></div>` : ""}`;
    $("katil").onclick = async () => {
      const b = $("katil"); b.disabled = true; $("hata").textContent = "";
      try {
        const k = await api("/kayit", { ad: $("ad").value, tel: $("tel").value, onay: $("onay").checked });
        sakla(k.id);
        kartim = k;
        if (tezgahtan) await damgaAl(); else kartCiz();
      } catch (e) { $("hata").textContent = e.message; b.disabled = false; }
    };
  }

  // ---------- Kart ----------
  function kartCiz(yeniDamgaIndex = -1) {
    const k = kartim;
    $("dukkan").textContent = k.dukkan;
    $("altBaslik").textContent = `Merhaba ${k.ad}`;
    let damgalar = "";
    for (let i = 0; i < k.hedef; i++) {
      const dolu = i < k.damga;
      damgalar += `<div class="damga ${dolu ? "dolu" : ""} ${i === yeniDamgaIndex ? "yeni" : ""}">${dolu ? "✓" : i + 1}</div>`;
    }
    const kalan = k.hedef - k.damga;
    const odulListe = k.oduller.length
      ? `<ul class="odul-listesi">${k.oduller.map((o) => `<li><span>${kac(o.urun)}</span><b>${odulYaz(o)}</b></li>`).join("")}</ul>`
      : '<div class="durum">Ödüller yakında açıklanacak.</div>';

    $("icerik").innerHTML = `
      ${bildirim ? `<div class="bildirim">${bildirim}</div>` : ""}
      ${k.odulHazir ? `<div class="hazir"><div class="buyuk">🎉 Ödülünüz hazır!</div>Bu alışverişinizde aşağıdaki indirimlerden yararlanın. Bu ekranı kasaya gösterin.</div>` : ""}
      <div class="kart">
        <h2>Damgalarınız</h2>
        <div class="damgalar">${damgalar}</div>
        <div class="durum">${k.odulHazir ? "Tüm damgaları topladınız!" : `Ödüle <b>${kalan} geliş</b> kaldı`}</div>
      </div>
      <div class="kart">
        <h2>${k.odulHazir ? "Kazandığınız indirimler" : `${k.hedef} damgada kazanacaklarınız`}</h2>
        ${odulListe}
      </div>
      <div class="kucuk">Damga almak için her gelişinizde dükkândaki QR'ı okutun.<br>${k.toplamGelis ? `Toplam ${k.toplamGelis} geliş` : ""}${k.odulSayisi ? ` · ${k.odulSayisi} ödül kullanıldı` : ""}</div>
      <div style="text-align:center"><button class="link" id="cikis">Bu kart benim değil</button></div>`;

    $("cikis").onclick = () => { sakla(null); kartim = null; bildirim = ""; kayitEkrani(); };
  }

  // Tezgâh QR'ı okutulunca damga hemen eklenir (günde bir kez)
  async function damgaAl() {
    try {
      const k = await api(`/m/${kartim.id}/istek`, {});
      kartim = k;
      if (k.sonuc === "eklendi") {
        bildirim = k.odulHazir ? "Damganız eklendi! 🎉 Ödülünüzü kazandınız." : "Damganız eklendi! Teşekkür ederiz.";
        return kartCiz(k.damga - 1);
      }
      bildirim = k.sonuc === "zaten" ? "Bugünkü damganız zaten alındı. Yarın tekrar bekleriz!" : "";
    } catch { bildirim = ""; }
    kartCiz();
  }

  async function basla() {
    const id = oku();
    if (!id) return kayitEkrani();
    try {
      kartim = await api(`/m/${id}`);
      if (tezgahtan) await damgaAl(); else kartCiz();
    } catch (e) {
      if (e.durum === 404) { sakla(null); return kayitEkrani(); }
      $("icerik").innerHTML = '<div class="durum">Bağlantı kurulamadı. Biraz sonra tekrar deneyin.</div>';
    }
  }
  basla();
</script>
</body>
</html>
